name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Only the light, pure-logic deps needed by the unit-tested modules
      # (chord smoothing, octave correction, reharm-progression merging).
      # Demucs/TensorFlow/Whisper/torch are NOT needed here - those stages
      # need real audio and heavy models, out of scope for CI. See
      # docs/ARCHITECTURE.md and docs/TECHNICAL_PAPER.md for why the test
      # suite is scoped this way.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2" scipy librosa pretty_midi music21 pytest ruff

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Unit tests (pytest)
        run: pytest tests/ -v --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml

  package-install-check:
    name: Full package install check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Validates that pyproject.toml's full dependency set (including the
      # heavy ML deps - torch, demucs, whisper) actually
      # resolves and the package imports cleanly. Does not run the audio
      # pipeline itself (no test audio/models fetched here).
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Import check
        run: python -c "import bengali_jazz_engine; print(bengali_jazz_engine.__version__)"
